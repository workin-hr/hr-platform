# TLS in front of the application, which is the shape every real deployment has
# and the only shape the admin dashboard works in: its session cookie is
# `secure` unconditionally (ADR-0015 prerequisite 6), so a browser on plain HTTP
# will accept the login and then discard the cookie.
#
# This exists so the E2E run exercises the dashboard WITHOUT relaxing that
# control. The certificate is self-signed and generated per run; Playwright is
# told to ignore it, and nothing else ever sees it.

events {}

http {
  access_log /dev/stdout;
  error_log  /dev/stderr;

  server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    # Employee photo and document uploads go through here.
    client_max_body_size 32m;

    location / {
      proxy_pass http://app:8080;
      proxy_http_version 1.1;

      # The application runs with server.forward-headers-strategy=native for
      # this run, so these three are what make it build https:// redirects and
      # log the real client address instead of this container's.
      #
      # $http_host, not $host: $host drops the port, so Tomcat built
      # `https://127.0.0.1/admin/login` for a proxy listening on 8443 and the
      # browser followed it to a port that speaks nothing. A real deployment
      # listens on 443 and would never have shown this -- which is exactly why
      # it is the kind of thing to get right where it is visible.
      proxy_set_header Host              $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header X-Forwarded-Port  $server_port;
      proxy_set_header X-Real-IP         $remote_addr;

      proxy_read_timeout 120s;
    }
  }
}
