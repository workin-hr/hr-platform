# TLS in front of production, and the port closed behind it.
#
#   docker compose -f compose.prod.yaml -f compose.tls.yaml \
#     --env-file .env.prod up -d
#
# Two things happen here, and the second matters as much as the first.
#
# **Caddy terminates TLS** on 80 and 443 and obtains its own certificates, so
# there is no renewal for an operator to remember. The dashboard needs this at
# all: its session cookie is `Secure` unconditionally (ADR-0015 prerequisite
# 6), so a browser on plain HTTP accepts the login and then discards the
# cookie.
#
# **The application's port stops being published.** `compose.prod.yaml` binds
# it to loopback, which is safe but still a second route in -- and the `prod`
# profile sets `server.forward-headers-strategy=native`, which means the
# application believes `X-Forwarded-For`. That is only true if the proxy is the
# *sole* route (R-049, and `running-the-backend.md`). `!override []` removes
# the published port rather than adding to it, because compose merges lists --
# and it only does that when this file comes AFTER the base file. The other way
# round, the base file's port is published again while the setting below still
# applies, which is the combination this file exists to prevent.
# `scripts/check_remote_db_pins.py` fails the build if either half leaves this
# file.
#
# No `name:` here on purpose. A later file's project name wins the merge, so
# declaring one would drag every stack this overlays into `workin-prod` --
# including a look-at-real-data run from `compose.remote-db.yaml`, which would
# then adopt production's containers and volumes. The base file names the
# project; this one only adds an edge to it.

services:
  app:
    ports: !override []
    environment:
      # Trust the edge's forwarded headers -- and only here, because this file is
      # the condition that makes them trustworthy: `ports: !override []` above
      # removes the application's own published port, so Caddy is the sole route
      # in from outside the host (R-049, D-206). Set on a stack that publishes the
      # application's port, a caller reaching that port from a private or loopback
      # address could write the header and be believed -- which, for a port bound
      # to 127.0.0.1 as these compose files bind it, is every caller that can
      # reach it.
      #
      # `compose.prod.yaml` runs profile `prod`, which already sets this, so that
      # pair is unchanged. `compose.remote-db.yaml` runs `local` or `integration`
      # rather than `prod`, which also expects WhatsApp credentials
      # (`app.legacy-whatsapp.*` has no default). `local` sets no strategy and
      # `integration` defaults it to `none`, so without this line the application
      # behind this proxy sees Caddy's address as every client's.
      #
      # That is not cosmetic. PlatformAdminLoginThrottle allows MAX_ATTEMPTS=8 per
      # 15 minutes per client key, a hash of "web:" + request.getRemoteAddr(), so
      # one shared address is one shared bucket: eight failed logins from anyone
      # lock out every administrator until the window expires. The same address
      # reaches the device registry, which persists it as `last_seen_ip` on
      # `attendance_devices` and `unclaimed_device_sightings`.
      #
      # Fixed rather than `${...:-native}`. There is no safe reason to opt out
      # behind this file, and an override is a way back to the lockout: an
      # environment variable beats `application-prod.properties`, so `none` in
      # `.env.prod` would silently revert production, which otherwise cannot be
      # overridden at all.
      #
      # What it changes, measured through Caddy with this Caddyfile: two clients
      # with different addresses land in two throttle buckets instead of one. A
      # client that sends its own X-Forwarded-For gains nothing -- Caddy replaces
      # that header rather than appending to it, so a forged X-Forwarded-For never
      # reaches the application. A public source that reaches the application
      # directly is not believed either; the trust boundary is Spring Boot's
      # default private-range list. A caller already on the host's Docker bridge
      # IS believed -- not reachable from the internet, but not nothing.
      #
      # That guarantee covers X-Forwarded-For only. The legacy OTP rate limit reads
      # its address through LegacyClientAddress -- CF-Connecting-IP, then
      # X-Forwarded-For, then X-Real-IP -- and Caddy passes the other two through.
      # Once Tomcat has consumed X-Forwarded-For, a forged X-Real-IP is what that
      # limit counts. A forged CF-Connecting-IP won with or without this line.
      #
      # Verify it through the proxy, by distinct `identifier_hash` values in
      # `platform_admin_login_attempts`. Not from the access log: its `%h` prints
      # the connection's own address in both configurations -- it does not read
      # the address the application uses -- and only profile `local` writes one.
      # And not by curling the application from the host: that arrives from the
      # Docker gateway, a private address, so a forged header is believed there --
      # which shows the header is honoured, not that the deployment works.
      SERVER_FORWARD_HEADERS_STRATEGY: native

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env.prod}
      # Passed through, or the devices site is literally `devices.localhost`
      # in production -- a name nobody set and nobody expects.
      APP_DEVICES_DOMAIN: ${APP_DEVICES_DOMAIN:-devices.localhost}
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL in .env.prod -- the certificate authority mails renewal failures there}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and the account key. A named volume, not a bind: losing
      # it means re-issuing on the next start, and Let's Encrypt rate-limits
      # that.
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${PROXY_MEMORY_LIMIT:-256m}

volumes:
  caddy-data:
  caddy-config:
