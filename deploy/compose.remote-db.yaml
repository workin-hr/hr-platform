# The backend in Docker, against a database somewhere else.
#
#   cp env.remote-db.example .env.remote-db     # then fill it in
#   docker compose -f compose.remote-db.yaml -f compose.tls.yaml \
#     --env-file .env.remote-db up -d --build
#
# For looking at real data with the real application before a cutover: no `db`
# service, no seed, no volume -- the application connects out to a MySQL that
# already exists.
#
# **This is the production database if you point it there.** Three things are
# therefore deliberately different from `compose.local.yaml`:
#
#   * administrative actions are **on**, and the condition for that is yours to
#     hold rather than this file's: ADR-0015 prerequisite 7 requires the legacy
#     PHP admin surface to be unreachable before this one performs a privileged
#     operation. Nothing in the application can check that. Close PHP when you
#     open this -- both write the same rows and neither knows about the other.
#     ADMIN_ACTIONS_ENABLED=false renders the company pages read-only instead.
#   * uploads have two modes, and which one you want depends on whether PHP is
#     staying up.
#
#     `UPLOADS_URL=https://the-php-host/uploads/` -- absolute -- means that host
#     serves them and this application registers no handler at all, so it cannot
#     appear to serve files it does not have. `UPLOADS_PATH` must then be that
#     host's own uploads directory, reachable from here, or a file written for a
#     new company lands where nothing serves it.
#
#     `UPLOADS_URL=/uploads/` -- site-relative -- means this application serves
#     them itself out of `UPLOADS_PATH`, behind the same TLS, with an extension
#     allowlist derived from sniffed content rather than from a client-supplied
#     filename. **This is the one a cutover wants**: an absolute URL at the PHP
#     host is a dependency on the host being switched off. It needs the existing
#     files copied into `UPLOADS_PATH` once, or everything already stored 404s.
#   * WhatsApp is left unset, so every OTP route answers 503 rather than
#     messaging a real person while somebody is looking around.
#
# The database keeps its own port. Nothing here publishes one.
name: workin-remote-db

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${APP_IMAGE:-workin-backend:local-build}
    restart: unless-stopped
    environment:
      # Explicit pass-through, following APP_LOG_LEVEL. `--env-file` variables
      # are used for INTERPOLATION only and are never injected into the
      # container, so a knob that is not named here does nothing at all -- the
      # exact defect this change set out to remove one layer further in.
      APP_TRACE_SAMPLING: ${APP_TRACE_SAMPLING:-0.05}
      APP_DB_MAX_POOL_SIZE: ${APP_DB_MAX_POOL_SIZE:-10}
      # `local` or `integration`. Not `prod`: that profile requires WhatsApp
      # credentials and trusts forwarded headers, neither of which belongs in a
      # session someone is using to look around.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-local}
      # Belt and braces on the stack that points at real data behind a public
      # edge: whatever the profile says, this one exposes health alone.
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health

      LEGACY_DB_JDBC_URL: jdbc:mariadb://${DB_HOST:?set DB_HOST in .env.remote-db}:${DB_PORT:-3306}/${DB_NAME:?set DB_NAME}
      LEGACY_DB_USERNAME: ${DB_USER:?set DB_USER}
      LEGACY_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}

      # R-024: the same value the PHP deployment signs with, or every token on
      # every device stops working the moment this answers a request.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET -- PHP's AppConfig::JWT_SECRET}

      APP_PLATFORM_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      # On: this surface replaces PHP's admin panel rather than shadowing it.
      # The precondition is that PHP is closed -- see the header.
      APP_PLATFORM_ADMIN_ACTIONS_ENABLED: ${ADMIN_ACTIONS_ENABLED:-true}

      # Where the stored files already are. An absolute URL means this
      # application serves none of them.
      APP_LEGACY_UPLOADS_URL: ${UPLOADS_URL:?set UPLOADS_URL, e.g. https://your-php-host/uploads/}
      # And where it writes them. The container path is fixed; what varies is
      # the host directory mounted onto it, below.
      APP_LEGACY_UPLOADS_PATH: /app/uploads
    volumes:
      # The directory `UPLOADS_URL` serves. On a cutover that is the PHP host's
      # own uploads directory, reachable here however you mount it -- the point
      # is only that a file written to this path is a file that URL answers
      # with. Defaults to a local directory so the stack still starts for a
      # look at real data, where nothing is uploaded and it stays empty.
      - ${UPLOADS_PATH:-./uploads-remote}:/app/uploads

    ports:
      - "127.0.0.1:${APP_PUBLISHED_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-1g}
    stop_grace_period: 40s
