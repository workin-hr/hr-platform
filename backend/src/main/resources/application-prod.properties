# The `prod` profile: the VPS, running Java and MariaDB and nothing else.
#
# Every secret below is REQUIRED WITH NO DEFAULT, so a missing one is a startup
# failure with the property named, not a service that comes up and behaves
# subtly differently. That is the whole design of this file: production's
# failure mode should be "it did not start", never "it started wrong".
#
# Nothing here is a credential. This file is committed; the values it names
# come from the deployment's environment. See deploy/.env.prod.example for the
# list an operator has to fill in.

app.legacy-db.jdbc-url=${LEGACY_DB_JDBC_URL}
app.legacy-db.username=${LEGACY_DB_USERNAME}
app.legacy-db.password=${LEGACY_DB_PASSWORD}

# Production's MariaDB runs non-strict, and 24 zero-date rows in the live data
# are why. A strict session would reject rows the live system holds.
app.legacy-db.connection-init-sql=${LEGACY_DB_CONNECTION_INIT_SQL:SET SESSION sql_mode=''}

# R-024: this MUST equal the PHP deployment's AppConfig::JWT_SECRET, or every
# token already on a user's device stops working -- and they are logged out
# twice, once at cutover and again when the refresh token is rejected. The
# application logs a fingerprint of this value at startup; compare it against
# PHP's before opening the window. See
# docs/operations/verifying-the-signing-secret.md.
app.jwt.secret=${JWT_SECRET}

# The PostgreSQL Phase-2 path is not active under this profile, but its
# properties are still declared. Named explicitly rather than defaulted, so
# that if Phase 2 ever activates here the omission is loud.
app.runtime-db.username=${APP_RUNTIME_DB_USERNAME:unused-under-phase1-mysql}
app.runtime-db.password=${APP_RUNTIME_DB_PASSWORD:unused-under-phase1-mysql}

# Required in production. Unset means every OTP-issuing route answers 503
# otp_delivery_failed -- which is legacy's behaviour without credentials, and
# would silently break registration, password reset and phone change on a live
# system. Better to refuse to start.
app.legacy-whatsapp.api-token=${LEGACY_WHATSAPP_API_TOKEN}
app.legacy-whatsapp.instance-id=${LEGACY_WHATSAPP_INSTANCE_ID}

# ADR-0015 prerequisite 7, and the one flag that must default OFF here.
# Enabling it while the legacy PHP admin surface is still reachable reopens the
# hole the entire MFA and step-up design exists to close: an attacker walks
# around it by logging into the weaker surface. Turning it on is a deliberate
# cutover step taken after PHP is confirmed unreachable, not a deployment
# default.
app.platform-admin.actions.enabled=${APP_PLATFORM_ADMIN_ACTIONS_ENABLED:false}

# Required: the TOTP seed is the one credential that must be stored
# recoverably, and it is encrypted under this key. A deployment that serves the
# admin surface without it fails at enrolment rather than storing a seed in the
# clear -- so it is required here, where that surface is real.
app.platform-admin.mfa.encryption-key=${APP_PLATFORM_ADMIN_MFA_ENCRYPTION_KEY}

# A mounted volume, not a container path that vanishes on redeploy: these are
# employee documents and company logos the legacy PHP wrote and the clients
# still fetch.
app.legacy-uploads.path=${APP_LEGACY_UPLOADS_PATH}
app.legacy-uploads.url=${APP_LEGACY_UPLOADS_URL:/uploads/}

# In-flight requests drain rather than being dropped on SIGTERM. 30s is longer
# than the slowest legitimate request measured (the payroll calculation on a
# large company) with room to spare.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Health only. R-043 records that this deployment is supervised rather than
# monitored -- a human tails the log during and after the window -- so this
# endpoint exists for the container's own healthcheck, not as a metrics story
# it cannot yet tell.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# The application sits behind a reverse proxy terminating TLS. Without this,
# every generated URL and every logged client address is the proxy's, and the
# session cookie's `secure` flag is set on a connection the container thinks is
# plain HTTP.
#
# R-049: this makes the app TRUST forwarded headers, which is only safe because
# the proxy is the sole route to the container -- the compose file publishes the
# app port on loopback for exactly that reason. The per-IP OTP cap is keyed on
# the client address and remains spoofable until that risk is closed; binding
# the container to loopback is what stops it being spoofable from the internet.
server.forward-headers-strategy=native

# The API description is NOT published in production. It is a development and
# integration aid, and an unauthenticated map of every endpoint on a live system
# is reconnaissance somebody else can use. Turned off rather than
# access-controlled, because "off" has no bypass.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=INFO
logging.level.com.workin=INFO
