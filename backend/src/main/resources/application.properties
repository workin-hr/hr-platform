spring.application.name=backend

spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/rls

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Placeholder for local/dev use only -- real secret management (a
# generated, environment-injected value, never committed) is required
# before this application is anywhere near production. Tracked as
# follow-up alongside ADR-0005's remaining refinements.
app.jwt.secret=${JWT_SECRET:dev-only-placeholder-secret-replace-before-any-real-deployment-000000}
app.jwt.access-token-ttl-seconds=900

# ADR-0008: structured logging + correlation ID. traceId/spanId (from
# Micrometer Tracing) double as the correlation ID across a request.
logging.structured.format.console=logstash
logging.pattern.correlation=[${spring.application.name},%X{traceId:-},%X{spanId:-}]
management.tracing.sampling.probability=1.0

spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=5000
