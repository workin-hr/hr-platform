spring.application.name=backend

spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/rls

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Required secrets/credentials: no committed fallback values. Startup
# must fail loudly if these are missing or if someone explicitly reuses
# the old placeholder JWT secret.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-seconds=900
# ADR-0005: refresh-token lifetime. 60 days, inside the accepted
# design's 30-90 day candidate range; a configurable starting value,
# not a product decision (that trade-off is still an open question in
# docs/security/authentication-remediation-design.md).
app.jwt.refresh-token-ttl-seconds=5184000
app.runtime-db.username=${APP_RUNTIME_DB_USERNAME}
app.runtime-db.password=${APP_RUNTIME_DB_PASSWORD}
spring.flyway.placeholders.app_runtime_db_username=${app.runtime-db.username}
spring.flyway.placeholders.app_runtime_db_password=${app.runtime-db.password}

# ADR-0013 / D-043: the phase1-mysql profile's MariaDB connection.
# Defaulted to empty, not required, because LegacyPersistenceConfig's
# beans -- the only place these are ever read -- are @Profile("phase1-mysql")
# and simply never constructed under the default profile.
app.legacy-db.jdbc-url=${LEGACY_DB_JDBC_URL:}
app.legacy-db.username=${LEGACY_DB_USERNAME:}
app.legacy-db.password=${LEGACY_DB_PASSWORD:}
# Optional per-connection session setup. Production inherits the existing MariaDB server contract;
# Phase 1 tests set this explicitly so application writes exercise the same non-strict semantics.
app.legacy-db.connection-init-sql=${LEGACY_DB_CONNECTION_INIT_SQL:}

# F-26: platform-admin identity. Shares app.jwt.secret (the distinct
# token issuer already makes cross-domain forgery impossible -- see
# PlatformAdminJwtService). Bootstrap phone/password are optional
# (empty by default): unset simply means no platform admin exists yet,
# not a startup failure -- see PlatformAdminBootstrap.
app.platform-admin.jwt.access-token-ttl-seconds=900
# 7 days, deliberately shorter than the tenant default: platform-admin
# sessions are the highest-privilege surface. Configurable starting
# value, same status as app.jwt.refresh-token-ttl-seconds.
app.platform-admin.jwt.refresh-token-ttl-seconds=604800
app.platform-admin.bootstrap.phone=${APP_PLATFORM_ADMIN_BOOTSTRAP_PHONE:}
app.platform-admin.bootstrap.password=${APP_PLATFORM_ADMIN_BOOTSTRAP_PASSWORD:}

# ADR-0008: structured logging + correlation ID. traceId/spanId (from
# Micrometer Tracing) double as the correlation ID across a request.
logging.structured.format.console=logstash
logging.pattern.correlation=[${spring.application.name},%X{traceId:-},%X{spanId:-}]
management.tracing.sampling.probability=1.0

spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=5000

# i18n (spec: docs/superpowers/specs/2026-08-08-backend-i18n-design.md).
# Missing key in a translation -> English base; missing everywhere ->
# the key itself renders (legacy t() unknown-key passthrough).
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.use-code-as-default-message=true
