spring.application.name=backend

# An oversized or malformed multipart request must still reach the legacy
# method/auth/company/role/availability guards before failing, exactly as
# PHP does by never touching $_FILES until those checks pass. Eager
# resolution parses (and can reject) the body in DispatcherServlet before
# the handler runs at all; lazy resolution defers parsing until the
# handler actually calls multipartFile(...).
spring.servlet.multipart.resolve-lazily=true

spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/rls

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Required secrets/credentials: no committed fallback values. Startup
# must fail loudly if these are missing or if someone explicitly reuses
# the old placeholder JWT secret.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-seconds=900
# ADR-0005: refresh-token lifetime. 60 days, inside the accepted
# design's 30-90 day candidate range; a configurable starting value,
# not a product decision (that trade-off is still an open question in
# docs/security/authentication-remediation-design.md).
app.jwt.refresh-token-ttl-seconds=5184000
app.runtime-db.username=${APP_RUNTIME_DB_USERNAME}
app.runtime-db.password=${APP_RUNTIME_DB_PASSWORD}
spring.flyway.placeholders.app_runtime_db_username=${app.runtime-db.username}
spring.flyway.placeholders.app_runtime_db_password=${app.runtime-db.password}

# ADR-0013 / D-043: the phase1-mysql profile's MariaDB connection.
# Defaulted to empty, not required, because LegacyPersistenceConfig's
# beans -- the only place these are ever read -- are @Profile("phase1-mysql")
# and simply never constructed under the default profile.
app.legacy-db.jdbc-url=${LEGACY_DB_JDBC_URL:}
app.legacy-db.username=${LEGACY_DB_USERNAME:}
app.legacy-db.password=${LEGACY_DB_PASSWORD:}
# Optional per-connection session setup. Production inherits the existing MariaDB server contract;
# Phase 1 tests set this explicitly so application writes exercise the same non-strict semantics.
app.legacy-db.connection-init-sql=${LEGACY_DB_CONNECTION_INIT_SQL:}

# R-015 / D-134: the Whats360 gateway behind every OTP the legacy auth and
# profile routes issue. Empty by default and NEVER committed with a value --
# the token is a credential and must come from the deployment's secret store.
#
# Unset means unconfigured, and unconfigured means every OTP-issuing route
# answers 503 otp_delivery_failed: auth/{resend_otp,forgot_password,
# register_company}, the verify-first branch of BOTH auth/login_company and
# auth/login_desktop (login_as=company), and profile/request_phone_change. That is
# legacy's own behaviour without credentials, and LegacyWhatsAppHttpSender logs
# "WhatsApp is not configured" at ERROR on every attempt so a misconfigured
# deployment is visible in the first log line rather than in a user report.
#
# Legacy's dev escape hatch -- returning success when unconfigured -- is
# deliberately not ported (D-134): it would make this a silent failure.
app.legacy-whatsapp.api-base=${LEGACY_WHATSAPP_API_BASE:https://pro.whats360.live/api/v1/send-text}
app.legacy-whatsapp.api-token=${LEGACY_WHATSAPP_API_TOKEN:}
app.legacy-whatsapp.instance-id=${LEGACY_WHATSAPP_INSTANCE_ID:}
app.legacy-whatsapp.instance-id-fallback=${LEGACY_WHATSAPP_INSTANCE_ID_FALLBACK:}

# F-26: platform-admin identity. Shares app.jwt.secret (the distinct
# token issuer already makes cross-domain forgery impossible -- see
# PlatformAdminJwtService). Bootstrap phone/password are optional
# (empty by default): unset simply means no platform admin exists yet,
# not a startup failure -- see PlatformAdminBootstrap.
app.platform-admin.jwt.access-token-ttl-seconds=900
# 7 days, deliberately shorter than the tenant default: platform-admin
# sessions are the highest-privilege surface. Configurable starting
# value, same status as app.jwt.refresh-token-ttl-seconds.
app.platform-admin.jwt.refresh-token-ttl-seconds=604800
app.platform-admin.bootstrap.phone=${APP_PLATFORM_ADMIN_BOOTSTRAP_PHONE:}
app.platform-admin.bootstrap.password=${APP_PLATFORM_ADMIN_BOOTSTRAP_PASSWORD:}

# ADR-0008: structured logging + correlation ID. traceId/spanId (from
# Micrometer Tracing) double as the correlation ID across a request.
logging.structured.format.console=logstash
logging.pattern.correlation=[${spring.application.name},%X{traceId:-},%X{spanId:-}]
management.tracing.sampling.probability=1.0

spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=5000

# i18n (spec: docs/superpowers/specs/2026-08-08-backend-i18n-design.md).
# Missing key in a translation -> English base; missing everywhere ->
# the key itself renders (legacy t() unknown-key passthrough).
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.use-code-as-default-message=true

# ADR-0015: the platform-admin web surface. Server-side sessions in shared
# JDBC storage (prerequisite 11) -- the application is otherwise entirely
# stateless, and an in-memory session would authenticate on one worker and be
# anonymous on the next, which silently defeats logout invalidation.
#
# `initialize-schema=never`: the tables are a Flyway migration
# (common/V46) like every other table, not something the session store
# creates behind Flyway's back.
spring.session.jdbc.initialize-schema=never
# Left at Spring Session's default (SPRING_SESSION). Naming it explicitly in
# lower case broke MySQL: Spring Session derives the attributes table as
# <table>_ATTRIBUTES, so `spring_session` became `spring_session_ATTRIBUTES`,
# which PostgreSQL folds to lower case and matches but a case-sensitive MySQL
# does not. The default matches the DDL on both.

# Prerequisite 6: session cookie flags are a security control, so they are set
# explicitly and pinned by PlatformAdminWebSessionTest rather than inherited
# from a container default. `secure` is unconditional -- this surface is not one
# to make convenient to run without TLS.
server.servlet.session.cookie.name=WORKIN_ADMIN_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
# Prerequisite 4, idle half. Mirrored by PlatformAdminWebSecurityConfig.IDLE_TIMEOUT;
# the absolute cap it pairs with cannot be expressed here because a servlet
# session only understands idle time -- see PlatformAdminSessionRevalidationFilter.
server.servlet.session.timeout=30m

# JTE templates are precompiled by the Gradle plugin, so there is no template
# directory to watch and nothing to recompile at runtime.
gg.jte.development-mode=false
gg.jte.use-precompiled-templates=true

# ADR-0015 prerequisite 1 / D-152: TOTP seed custody. The seed is the one
# credential that must be stored recoverably -- verifying a code needs it -- so
# it is encrypted at the application boundary under a key that lives in the
# deployment's secret store, NOT in the database. A key beside its ciphertext
# protects nothing.
#
# Empty by default and never committed with a value. Unset is not a startup
# failure, because most deployments never touch the platform-admin surface; it
# IS a failure at the point of use, so enrolment and verification refuse rather
# than silently storing a seed in the clear.
#
# Must decode to 32 bytes (AES-256). The version travels with each ciphertext so
# rotation is "add a key, re-encrypt, retire the old version" rather than
# "decrypt everything at once or lose the seeds".
app.platform-admin.mfa.encryption-key=${APP_PLATFORM_ADMIN_MFA_ENCRYPTION_KEY:}
app.platform-admin.mfa.encryption-key-version=${APP_PLATFORM_ADMIN_MFA_ENCRYPTION_KEY_VERSION:1}

# ADR-0015 prerequisite 7 is a deployment condition, not a code one: the JTE
# surface must not perform a privileged operation while the legacy PHP admin
# surface is reachable (D-152). Nothing in the application can check that, so
# administrative actions default to OFF and enabling them is a deliberate
# cutover step taken once the PHP surface is confirmed unreachable.
#
# Turning this on without that confirmation reopens the exact hole the whole
# MFA/step-up design exists to close: an attacker walks around it by logging
# into the weaker surface instead.
app.platform-admin.actions.enabled=${APP_PLATFORM_ADMIN_ACTIONS_ENABLED:false}
# D-164: the attendance-device push receiver (/iclock/**, ZKTeco ADMS).
# Default closed: unless a deployment sets this to true, neither the
# unauthenticated /iclock endpoints nor their security chain exist, so a
# deployment that has not been configured for devices exposes no device
# surface at all. The tenant device-management API (/api/v1/devices/**) is
# authenticated and always on.
app.devices.ingest.enabled=${APP_DEVICES_INGEST_ENABLED:false}
# Largest request body the receiver reads from a device before answering 413.
app.devices.ingest.max-body-bytes=1048576
# And the largest number of records in one upload. The byte cap alone does
# not bound the work: a body of minimal lines is tens of thousands of
# records, each of which becomes its own statement. Generous next to what a
# terminal actually sends per POST; an upload above it is refused so the
# device re-sends in smaller batches rather than having part of it dropped.
app.devices.ingest.max-records-per-upload=5000
