# The `integration` profile: a shared environment the mobile and desktop
# clients point at, and the profile CI runs the packaged jar under.
#
# Between `local` and `prod` in exactly one respect that matters: it holds no
# real customer data and never will, but it is REACHABLE BY MORE THAN ONE
# PERSON. So it takes its secrets from the environment like production does,
# rather than carrying development defaults like local does. A shared box with
# a committed signing secret is a shared box anyone can mint tokens for.

app.legacy-db.jdbc-url=${LEGACY_DB_JDBC_URL}
app.legacy-db.username=${LEGACY_DB_USERNAME}
app.legacy-db.password=${LEGACY_DB_PASSWORD}

# Required, no default. Deliberately NOT the production secret: a token minted
# here must not be accepted there, and the only thing that guarantees that is
# the secrets being different.
app.jwt.secret=${JWT_SECRET}

# Off unless explicitly enabled. The seed's phone numbers are generated, so a
# message would go nowhere real -- but "nowhere real" depends on the seed being
# what we think it is, and this environment is shared. Opt in per deployment.
app.legacy-whatsapp.api-token=${LEGACY_WHATSAPP_API_TOKEN:}
app.legacy-whatsapp.instance-id=${LEGACY_WHATSAPP_INSTANCE_ID:}

# Defaults ON here, unlike production: this environment exists to be exercised,
# and there is no legacy PHP admin surface beside it for ADR-0015
# prerequisite 7 to be about.
app.platform-admin.actions.enabled=${APP_PLATFORM_ADMIN_ACTIONS_ENABLED:true}

app.legacy-uploads.path=${APP_LEGACY_UPLOADS_PATH:/app/uploads}
app.legacy-uploads.url=${APP_LEGACY_UPLOADS_URL:/uploads/}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Published here. The clients integrate against this environment, so the
# description of what they are integrating with belongs beside it. It holds no
# real data, and production has it switched off entirely.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
# Sorted, so the list reads as a list rather than as reflection order.
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Off by default, opt-in per deployment. The admin surface's session cookie is
# `secure` unconditionally, so the moment anyone needs the dashboard on a shared
# box there is TLS in front of this container -- and without this, every redirect
# Tomcat builds carries the scheme it sees (http) and sends the browser back to
# a port that only speaks TLS.
#
# It defaults to `none` and not `native` for the reason R-049 records: this makes
# the application TRUST X-Forwarded-*, which is only safe when a proxy is the
# sole route to the port. Turn it on in the same change that puts one there.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}

# The health endpoint the compose healthcheck and any orchestrator read. Only
# health is exposed: this environment is reachable by more people than
# production's operators, and the other actuator endpoints describe the
# deployment in more detail than that audience needs.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

logging.level.com.workin=INFO
