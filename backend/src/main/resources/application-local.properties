# The `local` profile: a developer's machine, against the containerised
# MariaDB in deploy/compose.local.yaml.
#
# Who this is for: the mobile and desktop developers integrating against
# /apis/**. They get a database seeded with sanitised data, so every endpoint
# answers with something, and no real customer appears anywhere in it.
#
# Activated as `SPRING_PROFILES_ACTIVE=local`, which pulls in phase1-mysql
# through the group declared in application.properties.

# The compose file supplies these; the defaults here are the same values, so
# `./gradlew bootRun --args='--spring.profiles.active=local'` works against a
# `docker compose up db` with nothing else set.
app.legacy-db.jdbc-url=${LEGACY_DB_JDBC_URL:jdbc:mariadb://127.0.0.1:13307/workin}
app.legacy-db.username=${LEGACY_DB_USERNAME:workin}
app.legacy-db.password=${LEGACY_DB_PASSWORD:workin-local}

# Production runs a non-strict server -- that is how its zero-date rows came to
# exist -- so local runs one too. A strict session here would accept data the
# real system rejects and reject data it holds, and either way local would stop
# predicting production.
app.legacy-db.connection-init-sql=${LEGACY_DB_CONNECTION_INIT_SQL:SET SESSION sql_mode=''}

# A development secret, and it is committed on purpose: this profile never
# reaches real data, and a developer who has to invent a JWT secret before the
# stack starts will invent a worse one. `prod` requires a real secret with no
# default -- see application-prod.properties.
#
# Tokens minted here are not accepted by any other deployment, which is the
# point of it being different.
app.jwt.secret=${JWT_SECRET:local-development-only-not-a-production-secret-000}

# Unset, and left unset. With a token configured, exercising a password reset
# sends a real WhatsApp message to whatever number is in the row -- and while
# the seed's numbers are generated rather than real, the habit of running local
# with live messaging credentials is the one that eventually sends one.
# Every OTP route answers 503 otp_delivery_failed, which is legacy's own
# behaviour without credentials.
app.legacy-whatsapp.api-token=
app.legacy-whatsapp.instance-id=

# On, because this profile exists to let people exercise the product. The flag
# guards against acting while the legacy PHP admin surface is still reachable
# (ADR-0015 prerequisite 7); on a laptop, it is not.
app.platform-admin.actions.enabled=${APP_PLATFORM_ADMIN_ACTIONS_ENABLED:true}

# A fixed key so an enrolled second factor survives a container restart.
# Development-only, same reasoning as the JWT secret above.
app.platform-admin.mfa.encryption-key=${APP_PLATFORM_ADMIN_MFA_ENCRYPTION_KEY:d29ya2luLWxvY2FsLWRldmVsb3BtZW50LWtleS0zMmI=}

app.legacy-uploads.path=${APP_LEGACY_UPLOADS_PATH:./uploads}
app.legacy-uploads.url=${APP_LEGACY_UPLOADS_URL:/uploads/}

# The admin surface's session cookie is `secure` unconditionally (see
# application.properties), so http://localhost cannot hold an admin session.
# That is deliberate and is not relaxed here: /apis/** is bearer-token
# authenticated and needs no cookie, which is what this profile is for. To work
# on the admin UI, terminate TLS in front of it.

# Local runs one instance and restarts often; a long drain wastes a developer's
# time without protecting anything.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s

# The compose healthcheck reads this, so the app is only declared ready once it
# has actually connected to MariaDB rather than merely opened its port.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# INFO, not DEBUG. DEBUG on com.workin puts a transaction-manager commit on
# stdout every sixty seconds from Spring Session's cleanup job, so a developer
# running `docker compose up` in the foreground watches a wall of log lines
# scroll past with nothing happening. Raise it when chasing something:
#
#   APP_LOG_LEVEL=DEBUG docker compose -f compose.local.yaml up
logging.level.com.workin=${APP_LOG_LEVEL:INFO}

# One line per request, on stdout, which is what a mobile or desktop developer
# actually wants from this window: proof their call arrived, what it answered
# and how long it took. `directory=/dev` with `prefix=stdout` and no suffix is
# the standard way to send Tomcat's access log to the container's stdout rather
# than a file nobody will look in.
#
# Unbuffered, because an access log that appears thirty seconds later is worse
# than none while somebody is debugging.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.file-date-format=
server.tomcat.accesslog.buffered=false
# %{ms}T, not %D: in this Tomcat %D is MICROSECONDS, so a pattern labelling it
# ms reports an instant login as taking two and a half minutes. A latency
# number that lies is worse than no latency number.
server.tomcat.accesslog.pattern=%h %r -> %s (%{ms}Tms)
