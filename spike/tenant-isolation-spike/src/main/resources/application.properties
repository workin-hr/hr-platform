spring.application.name=tenant-isolation-spike

# H2 spike: no default profile. One of isolation-rls / isolation-guard
# must be active (set explicitly by tests via @ActiveProfiles, or via
# SPRING_PROFILES_ACTIVE when run manually) -- there is deliberately no
# default so a test can never silently run against the wrong mechanism.
spring.flyway.locations=classpath:db/migration/common

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# H2 spike only -- a real system generates/rotates this via a secrets
# manager, per docs/security/authentication-remediation-design.md. This
# fixed value exists only so the spike's JWT issuance/validation code has
# something concrete to run against.
spike.jwt.secret=spike-only-not-a-real-secret-0123456789abcdef0123456789abcdef
spike.jwt.access-token-ttl-minutes=15
