# Parity harness: PHP and Java served side by side from ONE MariaDB, so a
# response difference can only come from the application, never from the data.
#
# Versioned under spike/ so the parity results this harness produces are
# reproducible by a reviewer. spike/ is the one top-level directory the Phase 0
# lock excludes for exactly this kind of experiment (scripts/validate_phase0.py,
# SPIKE_DIR_NAME).
#
# LEGACY defaults to the sibling hr-legacy checkout; override it if your
# workspace is laid out differently.
services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: parity
      MARIADB_DATABASE: workin
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode=
    # Loopback only. The root password is committed and the seeded snapshot is
    # real legacy data -- employees, attendance, bcrypt hashes -- so publishing
    # on every interface would let any network peer connect as root and dump it.
    ports: ["127.0.0.1:13306:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  php:
    image: php:8.2-apache
    depends_on:
      db: {condition: service_healthy}
    # Loopback only, same reason: this serves the snapshot.
    ports: ["127.0.0.1:18080:80"]
    volumes:
      - ${LEGACY:-../../../hr-legacy}:/var/www/html:ro
      - ./php/constants.php:/var/www/html/apis/config/constants.php:ro
      - ./php/dashboard-constants.php:/var/www/html/dashboard/includes/constants.php:ro
      - ./php/uploads:/var/www/html/uploads
    # zip and calendar are not optional for a faithful comparison:
    #   - without zip, attendance/export and payslips/export answer 500
    #     ("ZipArchive extension required") where Java answers 200, so the
    #     XLSX endpoints cannot be compared at all;
    #   - without calendar, attendance/stats fatals on cal_days_in_month().
    # Both landed silently in the "not 200 on both" bucket, which is why the
    # harness looked like it covered them. max_execution_time is raised for the
    # same reason R-035 records: payroll for a real company exceeds PHP's 30s
    # default and is killed mid-batch.
    command: >
      bash -c "apt-get update >/dev/null 2>&1 &&
               apt-get install -y libzip-dev >/dev/null 2>&1 &&
               docker-php-ext-install pdo_mysql zip calendar >/dev/null 2>&1 &&
               printf 'max_execution_time=600\nmemory_limit=512M\n' > /usr/local/etc/php/conf.d/harness.ini &&
               a2enmod rewrite >/dev/null 2>&1 &&
               apache2-foreground"
