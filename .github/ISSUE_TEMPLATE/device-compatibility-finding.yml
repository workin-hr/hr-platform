name: Device compatibility finding
description: Attendance device compatibility, firmware, or protocol finding
title: "DEVICE-"
labels: ["device-compatibility"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: business_value
    attributes:
      label: Business value
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
    validations:
      required: true
  - type: input
    id: api_impact
    attributes:
      label: API impact
  - type: input
    id: database_impact
    attributes:
      label: Database impact
  - type: input
    id: flutter_impact
    attributes:
      label: Flutter impact
  - type: input
    id: security_impact
    attributes:
      label: Security impact
  - type: input
    id: performance_impact
    attributes:
      label: Performance impact
  - type: input
    id: migration_impact
    attributes:
      label: Migration impact
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >-
        This repository is public. Paste the visit report's results sheet, which is written with
        the terminal's serial and network addresses already removed. Do not add them back: a
        serial is the only thing that identifies a terminal to the device endpoint, so publishing
        one permits punch injection against a claimed device (R-041) or a squat on an unclaimed
        one (R-042). Refer to the terminal by its inventory pseudonym (TERMINAL-A, TERMINAL-B, ...)
        and keep the real values in the visit's own field-report/ folder.
  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of done
    validations:
      required: true
