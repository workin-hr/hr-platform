name: Independent Review Gate

# D-121 makes `chatgpt-codex-connector[bot]` the independent reviewer whose
# round discharges AGENTS.md's mandatory workflow. This workflow publishes a
# commit status named `independent-review` saying whether that round has
# happened on the pull request's current head SHA.
#
# Why this exists rather than relying on branch protection's existing knobs
# (R-008, and the PR #126 race it records):
#   - a required *approving* review does not help: this reviewer is read-only
#     and cannot approve, so a human approval satisfies that count while a
#     round is still in flight;
#   - `required_conversation_resolution` is necessary but not sufficient: it
#     blocks a merge while findings are open, and reports nothing at all when
#     the bot has not posted yet, or when fixes were pushed and the previous
#     head's threads were resolved. Both leave the *final* head unreviewed.
#
# Why a commit status rather than this job's own check conclusion: the gate has
# to be re-evaluated when a review arrives, which is a different event from the
# push that created the original check run. Publishing an explicit status
# against `pull_request.head.sha` makes both events converge on one context on
# the right commit, instead of depending on how two workflow runs of the same
# name supersede each other. The job therefore succeeds whenever it managed to
# publish; `independent-review` is the signal, not this job.
#
# The status is advisory until a human adds `independent-review` to `main`'s
# required contexts, which cannot happen while branch protection is Deferred
# under D-013 — see docs/bootstrap/risk-register.md R-008 and
# scripts/check-branch-protection.sh, which requires the context once applied.
# A green status is evidence for the merge sequence's step 5. It says a round
# happened, not that its findings were addressed; that is step 7, and it is what
# required_conversation_resolution covers.
#
# Fork limitation, disclosed rather than worked around: `GITHUB_TOKEN` is
# read-only for pull requests from forks, so the status cannot be published for
# those. Every pull request in this repository is opened from a branch on the
# repository itself.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A submitted review is what flips the status green.
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  # Keyed on the commit, not the pull request: two events racing on the same
  # head must not both publish, and a new push has its own group.
  group: independent-review-gate-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  publish-status:
    name: publish independent-review status
    runs-on: ubuntu-24.04
    steps:
      - name: Publish whether the named reviewer has reviewed this head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # D-121 owns this value. scripts/validate_phase0.py binds it to
          # AGENTS.md and the responsibility matrix, so it cannot drift here
          # on its own.
          REVIEWER: "chatgpt-codex-connector[bot]"
        run: |
          set -euo pipefail

          echo "Pull request #$PR, head $HEAD_SHA"
          echo "Required independent reviewer: $REVIEWER"

          # Counted by lines, not by a per-page `length`: `--paginate` emits a
          # separate JSON array per page, so `--jq '... | length'` returns one
          # count per page -- "0\n0" on a pull request with more than 100
          # reviews. `[ "0\n0" -eq 0 ]` is an error rather than a false, and an
          # erroring `if` condition falls through to the success path, so that
          # shape would report a green gate on an unreviewed head. Emitting one
          # line per match and counting lines is immune to the page boundary.
          # (`--slurp` would also work but is not in every `gh` version.)
          reviews_on_head="$(
            gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
              --jq '.[] | select(.user.login == env.REVIEWER and .commit_id == env.HEAD_SHA) | .commit_id' \
              | wc -l | tr -d '[:space:]'
          )"

          if [ "$reviews_on_head" -eq 0 ]; then
            latest="$(
              gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
                --jq '.[] | select(.user.login == env.REVIEWER) | .commit_id[0:7]' \
                | tail -n 1
            )"
            latest="${latest:-none}"
            state="failure"
            description="No review from $REVIEWER on this head (latest: $latest)"
            echo
            echo "FAIL: $REVIEWER has not reviewed $HEAD_SHA."
            echo "      Most recent round from that reviewer: $latest"
            echo
            echo "AGENTS.md's mandatory workflow places an independent review before human"
            echo "merge, and D-121 requires the round to cover the final head — commits"
            echo "pushed after a round are unreviewed until review is re-requested."
            echo
            echo "Comment '@codex review' on the pull request; this status turns green when"
            echo "the round lands. If the reviewer's quota is exhausted (risk R-009) the gate"
            echo "is unavailable, not waived: the merge waits."
          else
            state="success"
            description="$REVIEWER reviewed this head"
            echo
            echo "OK: $REVIEWER submitted $reviews_on_head review(s) on this head."
            echo "This proves a round happened. It does not prove its findings were addressed —"
            echo "that is the merge sequence's step 7, and unresolved threads are what"
            echo "required_conversation_resolution blocks on."
          fi

          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="independent-review" \
            -f description="$description" \
            -f target_url="$RUN_URL" \
            --jq '.context + " = " + .state'
