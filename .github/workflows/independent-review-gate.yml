name: Independent Review Gate

# D-121 makes `chatgpt-codex-connector[bot]` the independent reviewer whose
# round discharges AGENTS.md's mandatory workflow. This workflow publishes a
# commit status named `independent-review` saying whether that round has
# happened on the pull request's current head SHA.
#
# Why this exists rather than relying on branch protection's existing knobs
# (R-008, and the PR #126 race it records):
#   - a required *approving* review does not help: this reviewer is read-only
#     and cannot approve, so a human approval satisfies that count while a
#     round is still in flight;
#   - `required_conversation_resolution` is necessary but not sufficient: it
#     blocks a merge while threads are open, and reports nothing at all when
#     the bot has not posted yet, or when fixes were pushed and the previous
#     head's threads were resolved. Both leave the *final* head unreviewed.
#     Note what it does NOT prove: resolution is a state a human can set
#     without changing a line or answering, so it shows no thread is open --
#     never that a finding was addressed. That remains step 7's human
#     obligation (R-008).
#
# The status is keyed on the commit, not the pull request, so it is computed
# across every open pull request pointing at that commit -- see the loop below.
#
# Why a commit status rather than this job's own check conclusion: the gate has
# to be re-evaluated when a review arrives, which is a different event from the
# push that created the original check run. Publishing an explicit status
# against `pull_request.head.sha` makes both events converge on one context on
# the right commit, instead of depending on how two workflow runs of the same
# name supersede each other. The job therefore succeeds whenever it managed to
# publish; `independent-review` is the signal, not this job.
#
# The status is a REQUIRED check on `main` as of D-125 (2026-08-29) -- no longer
# advisory. `scripts/check-branch-protection.sh` verifies it is in the required
# contexts. A green status carries the merge sequence's step 5: it says a round
# happened on this head, not that its findings were addressed. That is step 7,
# and nothing in this repository verifies it mechanically (R-008).
#
# NOT a fork limitation. This once read that `GITHUB_TOKEN` is read-only for
# fork pull requests so the status could not be published for them. That was
# true under `pull_request`; under `pull_request_target` and `issue_comment`
# the job runs in BASE context and holds the `statuses: write` declared below
# whatever the head's origin. The status IS published for fork pull requests,
# and the round-attribution rules further down are what constrain who may
# satisfy it -- so do not read this paragraph as a mitigation, because it never
# was one. Every pull request in this repository is opened from a branch on the
# repository itself, which is a fact about practice, not an access control.

# `pull_request_target`, not `pull_request` -- the owner's decision, D-122.
#
# A `pull_request` run executes the workflow file *from the pull request* while
# holding `statuses: write`. A revision could keep the reviewer and context
# literals `validate_phase0.py` binds, replace the counting logic with an
# unconditional success, and turn this status green before the named reviewer had
# seen that very change. That is a bypass the moment the status gates a merge.
# `pull_request_target` runs the base branch's copy, which is the trusted one.
#
# The standing hazard of this trigger is privileged credentials running
# pull-request code. **This job runs none.** It has no `actions/checkout`, no step
# that reads the head tree, and no use of `github.event.pull_request.title`,
# `.body`, `.head.ref` or any other attacker-controlled string -- it passes only a
# number and a SHA to the GitHub API. `validate_workflow_safety()` permits the
# trigger here on exactly that premise and fails the moment a checkout appears,
# so the exception cannot quietly become a general one.
#
# `pull_request_review` already runs the default branch's copy and needed no
# change.
#
# BOOTSTRAP CONDITION -- expected, and self-resolving at merge. This trigger
# resolves the workflow from the **base** branch, so it fires only once this file
# exists there. Until the pull request introducing it merges to `main`, no
# push/synchronize run happens at all and the status is maintained solely by
# review events. That fails safe rather than open: a freshly pushed head simply
# has *no* status, which leaves a required check unsatisfied, instead of carrying
# a stale green from an earlier head. Verify after the first merge that a push
# produces a run.
on:
  pull_request_target:
    # `closed` is here because the status is shared across every open pull
    # request at a commit: when an unreviewed sibling closes, the set shrinks
    # and the survivor may now satisfy the gate. Without a recompute, the last
    # shared `failure` would stick until somebody manufactured another event.
    # `edited` is here for the base change alone -- see the job's guard.
    types: [opened, synchronize, reopened, ready_for_review, closed, edited]
  # A submitted review is what flips the status green; a dismissed one takes it
  # back, which is why dismissed reviews are also excluded from the count.
  pull_request_review:
    types: [submitted, dismissed]
  # A CLEAN round posts an issue comment and NO review, so it raises neither of
  # the events above. Recognising that comment in the count achieves nothing if
  # nothing recomputes the status afterwards -- which is exactly what happened
  # on #164: the reviewer posted its clean round, the gate would have counted
  # it, and the standing red status was never recomputed because no event fired.
  #
  # `issue_comment` always runs the DEFAULT BRANCH's copy of this file, so it
  # carries the same trust property as pull_request_target and needs no extra
  # premise. The job below still reads no pull-request content.
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  # Keyed on the PULL REQUEST, so every event for it serialises -- push,
  # review, comment and retarget alike.
  #
  # Keying on the head SHA looked tighter and was wrong: an issue_comment
  # payload carries no SHA, so a comment run landed in a different group from a
  # concurrent retarget run for the same pull request. The comment run could
  # then read the standing status BEFORE the retarget published its marker,
  # match the pre-retarget review on the unchanged SHA, and publish success
  # after the retarget published failure. Latest status wins, so the gate would
  # go green for a diff the reviewer never saw -- the one outcome it exists to
  # prevent.
  #
  # Two pull requests sitting on the same commit still race, and harmlessly:
  # the job below computes its answer across every open pull request at that
  # commit, so both runs compute the same value.
  group: independent-review-gate-pr-${{ github.event.pull_request.number
    || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  publish-status:
    name: publish independent-review status
    runs-on: ubuntu-24.04
    # `edited` fires for a title or body edit too. Only a base change matters
    # here, and GitHub sets `changes.base` only for that.
    # `edited` fires for a title or body edit too; only a base change matters.
    # An issue_comment is only relevant when the issue IS a pull request.
    if: >-
      (github.event_name != 'pull_request_target' || github.event.action != 'edited'
       || github.event.changes.base != null)
      && (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
    steps:
      - name: Publish whether the named reviewer has reviewed this head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          # Absent on issue_comment; resolved from the API below rather than
          # trusting anything in the comment payload.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_CHANGED: ${{ github.event_name == 'pull_request_target' && github.event.action == 'edited'
            && github.event.changes.base != null }}
          # The standing status carries this prefix while a retarget is
          # unanswered, so a later run can tell "invalidated" from "never green".
          RETARGET_MARKER: "Base branch changed -- a new review round is required"
          # D-121 owns this value. scripts/validate_phase0.py binds it to
          # AGENTS.md and the responsibility matrix, so it cannot drift here
          # on its own.
          REVIEWER: "chatgpt-codex-connector[bot]"
          # D-226: an agent round is recorded by the IMPLEMENTER, because the
          # reviewer is read-only and cannot post. So it cannot be attributed to
          # the REVIEWER by author login the way a Codex round can.
          #
          # It can still be attributed to the CLAIMANT, and must be: a marker
          # matched on body text alone is postable by anyone who can comment,
          # which on a public repository is every GitHub account -- including a
          # third party greening a stranger's pull request. The three predicates
          # below are what keep that from being true.
          #
          # Trust boundary, stated plainly and NOT overclaimed: this is forgeable
          # by anyone who can already WRITE to this repository. It proves a
          # writer claimed a round naming this head; it does not prove a review
          # happened, and an implementer can still self-attest. D-226 records
          # that reduction. The compensating control for the remaining gap is
          # scripts/check-review-dispositions.sh, which requires the finding
          # threads the marker claims.
          #
          # Anchored to a line start so a comment QUOTING this file -- a review
          # of the gate itself -- is not counted as a round on it.
          AGENT_ROUND_RE: '(^|\n)independent-review-round: agent'
          # Authorisation is the recording account's REPOSITORY PERMISSION,
          # read from the collaborators API -- not `author_association` (D-228).
          # Association is derived from ORG MEMBERSHIP VISIBILITY as well as
          # access: a repository admin whose membership is private is reported
          # as CONTRIBUTOR to a token that cannot see that membership, which is
          # what GITHUB_TOKEN is. Measured on this repository: the owner's own
          # round read as MEMBER to their PAT and CONTRIBUTOR unauthenticated,
          # so the gate counted zero rounds on a head it had reviewed. Widening
          # the list to CONTRIBUTOR would have fixed it by letting anyone with
          # one merged commit self-certify; permission is both narrower and
          # immune to who is asking.
          ROUND_AUTHOR_PERMISSIONS: 'admin,write'
        run: |
          set -euo pipefail

          # issue_comment carries no head SHA. Resolve it from the pull request
          # itself -- never from the comment, which is attacker-controlled text.
          if [ -z "${HEAD_SHA:-}" ]; then
            HEAD_SHA="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
            export HEAD_SHA
            echo "Resolved head $HEAD_SHA for #$PR from the pull request"
          fi

          # Every round this reviewer has completed on a given head, newest
          # last, one ISO timestamp per line.
          #
          # A round is EITHER a review object OR a comment carrying the
          # reviewer's "Reviewed commit" marker, and the second half is not a
          # convenience -- it is the only form a CLEAN round takes. Measured
          # across this repository's history:
          #
          #   findings      a review object on the head, body beginning
          #                 "Here are some automated review suggestions"
          #   no findings   an ISSUE COMMENT, no review object at all, body
          #                 beginning "Codex Review: Didn't find any major
          #                 issues." followed by a varying sign-off
          #
          # Counting only review objects therefore turned the gate RED exactly
          # when the reviewer found nothing wrong. #163 is the demonstrated
          # case: a clean round on its final head, gate red, merged anyway.
          #
          # #155 and #156 look similar and are NOT the same thing -- their clean
          # rounds name earlier commits (8478781b, c4ad9708) than the heads that
          # merged, so their red gate was correct and this change leaves it red.
          # Worth writing down because the two are indistinguishable from the
          # status alone, and only one of them is a defect.
          #
          # The marker is the discriminator, not the prose: the sign-off varies
          # ("Bravo.", "Keep it up!", "Breezy!", ":tada:"), while
          # "**Reviewed commit:** <sha>" (the sha in markdown code) is present in
          # every completed round and absent from every "You have reached your
          # Codex usage limits" message. That is the line R-009 draws -- a quota-
          # blocked reviewer leaves the gate UNAVAILABLE, never satisfied -- and
          # it is why matching the marker rather than "no issues" is the safe
          # choice: a quota message can never satisfy it.
          #
          # The SHA is matched as a PREFIX because the marker abbreviates it,
          # and only against this head, so a marker naming another commit does
          # not count. Minimum seven hex characters, so a truncated or malformed
          # marker cannot match everything.
          #
          # Trust boundary, stated rather than assumed: the filter is
          # `user.login == REVIEWER`, which nobody else can forge. A repository
          # ADMIN could edit the bot's comment body to name a different SHA --
          # but an admin can already merge, so this grants no capability that
          # was not already held. Review objects have the same property.
          # Emits one line per round: "<ISO timestamp> <codex|agent>". The
          # timestamp leads because the retarget comparison below sorts these
          # and compares them against a marker time; a leading tag would sort by
          # mechanism and make every comparison against a bare timestamp false,
          # silently clearing a base-change invalidation that must hold the gate
          # red. Consumers that want the time alone strip the tag with `%% *`.
          # May this account record a round? Repository permission, not
          # author_association (D-228). The collaborators API answers `admin`,
          # `write`, `read` or `none`, and that answer does not depend on who is
          # asking or on whether an org membership is public.
          #
          # FAILS CLOSED and says so: a 403, a rate limit, a renamed account or
          # any unexpected shape yields no permission, the round is not counted,
          # and the reason is printed. A gate that cannot establish authority
          # must go red, not quietly green.
          round_author_is_trusted() {  # $1=login
            local login="$1" permission
            # A login is [A-Za-z0-9-]; anything else is not one, and must not be
            # pasted into a URL.
            case "$login" in
              ""|*[!A-Za-z0-9-]*)
                echo "  ignoring a round: '$login' is not a usable login" >&2
                return 1 ;;
            esac
            permission="$(gh api "repos/$REPO/collaborators/$login/permission" \
                --jq '.permission' 2>/dev/null || true)"
            case ",${ROUND_AUTHOR_PERMISSIONS}," in
              *",${permission},"*) return 0 ;;
            esac
            echo "  ignoring a round by $login: repository permission" \
                 "'${permission:-unreadable}' is not in ${ROUND_AUTHOR_PERMISSIONS}" >&2
            return 1
          }

          rounds_on_head() {  # $1=pull request number -> "<timestamp> <kind>" per round
            local pr="$1"
            gh api "repos/$REPO/pulls/$pr/reviews" --paginate \
              --jq '.[] | select(.user.login == env.REVIEWER and .commit_id == env.HEAD_SHA
                      and .state != "DISMISSED") | "\(.submitted_at) codex"' || true
            gh api "repos/$REPO/issues/$pr/comments" --paginate \
              --jq '.[] | select(.user.login == env.REVIEWER)
                      | select(.body | test("\\*\\*Reviewed commit:\\*\\* \\x60[0-9a-f]{7,40}\\x60"))
                      | [.created_at,
                         (.body | capture("\\*\\*Reviewed commit:\\*\\* \\x60(?<sha>[0-9a-f]{7,40})\\x60").sha)]
                      | @tsv' 2>/dev/null \
              | while IFS="$(printf '\t')" read -r at sha; do
                  # Prefix, anchored at the start: `${HEAD_SHA#$sha}` differing
                  # from HEAD_SHA means it matched at position 0.
                  case "$HEAD_SHA" in "$sha"*) [ -n "$sha" ] && echo "$at codex" ;; esac
                done || true

            # D-226 agent rounds. Same SHA-binding rule as above: the marker must
            # name THIS head, so a round cannot be carried forward to a commit the
            # reviewer never saw.
            #
            # `created_at == updated_at` refuses an EDITED comment. Without it the
            # SHA binding is worth nothing: post a round naming head A, push
            # commits, then edit the same comment to name head B. `edited` is one
            # of this workflow's own triggers, so that would re-green the gate
            # with no new comment for a human to notice.
            # Authorisation is checked per candidate, AFTER the cheap filters,
            # by round_author_is_trusted -- see D-228 and the env note above.
            # shellcheck disable=SC2016
            gh api "repos/$REPO/issues/$pr/comments" --paginate \
              --jq '.[] | select(.created_at == .updated_at)
                      | select(.body | test(env.AGENT_ROUND_RE))
                      | select(.body | test("head: [0-9a-f]{40}"))
                      | [.created_at,
                         (.body | capture("head: (?<sha>[0-9a-f]{40})").sha),
                         .user.login]
                      | @tsv' 2>/dev/null \
              | while IFS="$(printf '\t')" read -r at sha login; do
                  [ "$sha" = "$HEAD_SHA" ] || continue
                  round_author_is_trusted "$login" || continue
                  echo "$at agent"
                done || true
          }

          # A retarget changes the reviewed diff while the head SHA stays put, so
          # a review matching on commit_id alone would still look valid for a
          # diff the reviewer never saw. Fail outright and require a new round.
          # Recorded in the status description, not just acted on once: a later
          # review event would otherwise take the normal path, match the
          # pre-retarget review on the unchanged head SHA, and republish success.
          # Every run reads the standing status first and refuses to clear a
          # retarget marker that no newer round has answered.
          if [ "$BASE_CHANGED" != "true" ]; then
            standing="$(
              gh api "repos/$REPO/commits/$HEAD_SHA/status" \
                --jq "[.statuses[] | select(.context == \"independent-review\")]
                      | sort_by(.updated_at) | last | .description // \"\"" 2>/dev/null || true
            )"
            case "$standing" in
              "$RETARGET_MARKER"*)
                # EVERY open pull request at this commit, not just this one.
                #
                # The status and the retarget marker are keyed on the SHA and so
                # are shared, while the concurrency group is keyed on the pull
                # request -- so a run for sibling B can see A's marker, compare
                # it against B's own newer round, and clear an invalidation that
                # belongs to A. Requiring the OLDEST round across all of them to
                # postdate the marker keeps the invalidation intact whichever
                # sibling happens to run.
                siblings="$(
                  gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --paginate \
                    --jq '.[] | select(.state == "open" and .head.sha == env.HEAD_SHA) | .number' \
                    | sort -u
                )"
                siblings="${siblings:-$PR}"
                newest_round=""
                for sibling in $siblings; do
                  round="$(rounds_on_head "$sibling" | sort | tail -n 1)"
                  round="${round%% *}"  # drop the mechanism tag; compare times
                  if [ -z "$round" ]; then
                    newest_round=""
                    break
                  fi
                  if [ -z "$newest_round" ] || [ "$round" \< "$newest_round" ]; then
                    newest_round="$round"
                  fi
                done
                marked_at="${standing##*@ }"
                if [ -z "$newest_round" ] || [ "$newest_round" \< "$marked_at" ]; then
                  echo "A base change is still outstanding on this head (marked $marked_at)"
                  echo "and $REVIEWER has submitted no round since. Leaving the gate red."
                  exit 0
                fi
                ;;
            esac
          fi

          if [ "$BASE_CHANGED" = "true" ]; then
            echo "FAIL: the pull request was retargeted to a different base."
            echo "      The head SHA is unchanged, but the diff is not, so the"
            echo "      previous round no longer covers what would be merged."
            echo
            echo "Comment '@codex review' to request a round against the new base."
            gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
              -f state="failure" \
              -f context="independent-review" \
              -f description="$RETARGET_MARKER @ $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -f target_url="$RUN_URL" \
              --jq '.context + " = " + .state'
            exit 0
          fi

          echo "Triggered by pull request #$PR, head $HEAD_SHA"
          echo "Required independent reviewer: $REVIEWER"

          # A commit status is keyed on the SHA alone -- it carries no pull
          # request identity, and every open pull request pointing at this
          # commit sees the same context. Publishing "reviewed" on the strength
          # of one pull request's round would hand a green gate to a sibling
          # pull request whose own diff (different base, therefore different
          # changes) the reviewer never saw. The status is repo-wide, so its
          # meaning is repo-wide: green only when EVERY open pull request at
          # this SHA has its own round on this SHA.
          open_prs="$(
            gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --paginate \
              --jq '.[] | select(.state == "open" and .head.sha == env.HEAD_SHA) | .number' \
              | sort -u
          )"
          if [ -z "$open_prs" ]; then
            open_prs="$PR"
          fi
          echo "Open pull requests at this commit: $(echo "$open_prs" | tr '\n' ' ')"

          unreviewed=""
          # Which mechanism satisfied the gate, for the status description.
          agent_rounds_seen=""
          for pr in $open_prs; do
            # Counted by lines, not by a per-page `length`: `--paginate` emits a
            # separate JSON array per page, so `--jq '... | length'` returns one
            # count per page -- "0\n0" past 100 reviews. `[ "0\n0" -eq 0 ]` is
            # an error rather than a false, and an erroring `if` condition falls
            # through to the success path, which would report a green gate on an
            # unreviewed head. One line per match, counted, has no page boundary
            # to trip over. (`--slurp` would also work but is not in every `gh`.)
            rounds="$(rounds_on_head "$pr")"
            count="$(printf '%s' "$rounds" | grep -c . || true)"
            echo "  #$pr: $count round(s) on this head" \
                 "(codex: $(printf '%s' "$rounds" | grep -c ' codex$' || true)," \
                 "agent: $(printf '%s' "$rounds" | grep -c ' agent$' || true))"
            if printf '%s' "$rounds" | grep -q ' agent$'; then
              agent_rounds_seen=yes
            fi
            if [ "$count" -eq 0 ]; then
              unreviewed="$unreviewed #$pr"
            fi
          done

          if [ -n "$unreviewed" ]; then
            latest="$(
              gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
                --jq '.[] | select(.user.login == env.REVIEWER and .state != "DISMISSED")
                        | .commit_id[0:7]' \
                | tail -n 1
            )"
            latest="${latest:-none}"
            state="failure"
            # GitHub caps a commit-status description at 140 characters and
            # rejects the call above it. Enough unreviewed siblings would push
            # the full list past that, the POST would fail, and an earlier
            # success on this SHA would stay as the required context -- the
            # failure path silently not failing. The log keeps the full list.
            description="No review from $REVIEWER on this head for:${unreviewed}"
            if [ "${#description}" -gt 140 ]; then
              count="$(printf '%s' "$unreviewed" | wc -w | tr -d '[:space:]')"
              description="No review from $REVIEWER on this head for $count pull request(s) -- see the run log"
            fi
            echo
            echo "FAIL: $REVIEWER has not reviewed $HEAD_SHA for:${unreviewed}"
            echo "      Most recent round on #$PR from that reviewer: $latest"
            echo
            echo "AGENTS.md's mandatory workflow places an independent review before human"
            echo "merge, and D-121 requires the round to cover the final head — commits"
            echo "pushed after a round are unreviewed until review is re-requested."
            echo
            echo "Either mechanism turns this green, on every pull request listed above:"
            echo "  * comment '@codex review' for a round from $REVIEWER; or"
            echo "  * run the independent-review skill and record the round, per D-226 and"
            echo "    .agents/skills/independent-review/SKILL.md."
            echo "If the Codex quota is exhausted (risk R-009) that half is unavailable, not"
            echo "waived -- D-226 is the answer to it, and the merge otherwise waits."
          else
            state="success"
            # Two mechanisms satisfy this gate, and the status is the durable
            # record a future auditor reads first. Naming only Codex there
            # asserts something false about who reviewed -- which is the very
            # thing D-226's Forbidden Behavior clause prohibits the evidence
            # comment from doing.
            if [ -n "$agent_rounds_seen" ]; then
              by="an independent-review-agent round (D-226)"
            else
              by="$REVIEWER"
            fi
            description="Reviewed by $by on every open PR at this commit"
            echo
            echo "OK: every open pull request at this commit has a round -- $by."
            echo "This proves a round happened. It does not prove its findings were addressed —"
            echo "that is the merge sequence's step 7."
          fi

          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="independent-review" \
            -f description="$description" \
            -f target_url="$RUN_URL" \
            --jq '.context + " = " + .state'
