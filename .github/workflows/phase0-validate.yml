name: Phase 0 Bootstrap Validate

on:
  pull_request:
  push:
    branches:
      - main
      - "bootstrap/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify bootstrap repository
        run: ./scripts/verify-bootstrap.sh
