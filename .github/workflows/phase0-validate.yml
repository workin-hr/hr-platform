name: Phase 0 Validate

on:
  pull_request:
  push:
    branches:
      - main
      - "bootstrap/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Phase 0 repository
        run: python3 scripts/validate_phase0.py
