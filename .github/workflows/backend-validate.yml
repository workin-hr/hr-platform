name: Backend Validate

# backend/ was unlocked for real implementation on 2026-08-05
# (docs/bootstrap/decision-log.md D-028). This workflow is separate from
# Phase 0 Bootstrap Validate (phase0-validate.yml), which continues to
# gate every other component directory.

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-validate.yml"
      # The detectors this workflow runs guard files outside backend/, so a PR
      # touching only a detector, its regression suite, or the collection it
      # protects would otherwise skip the step that guards it and stay green.
      - "scripts/check_legacy_modules_drift.py"
      - "scripts/test_check_legacy_modules_drift.py"
      - "scripts/check_legacy_sensitive_keys_drift.py"
      - "scripts/test_check_legacy_sensitive_keys_drift.py"
      - "scripts/check_legacy_excel_error_codes_drift.py"
      - "scripts/test_check_legacy_excel_error_codes_drift.py"
      - "scripts/check_client_endpoints_drift.py"
      - "scripts/test_check_client_endpoints_drift.py"
      - "scripts/check_legacy_schema_drift.py"
      - "spike/parity-harness/client-endpoints.txt"
  push:
    branches:
      - main
      - "bootstrap/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-validate.yml"
      - "scripts/check_legacy_modules_drift.py"
      - "scripts/test_check_legacy_modules_drift.py"
      - "scripts/check_legacy_sensitive_keys_drift.py"
      - "scripts/test_check_legacy_sensitive_keys_drift.py"
      - "scripts/check_legacy_excel_error_codes_drift.py"
      - "scripts/test_check_legacy_excel_error_codes_drift.py"
      - "scripts/check_client_endpoints_drift.py"
      - "scripts/test_check_client_endpoints_drift.py"
      - "scripts/check_legacy_schema_drift.py"
      - "spike/parity-harness/client-endpoints.txt"

permissions:
  contents: read

# One run per branch head, and a new push kills the one it supersedes.
#
# The suite takes about twenty minutes, so three pushes in quick succession --
# a fix, a review response, a typo -- used to mean an hour of runner time to
# learn one answer about the last of them. Nothing here publishes a status
# another job reads, unlike the review gate next door, so cancelling a
# superseded run loses nothing: its result was about a commit that is no longer
# the head.
#
# The key is the *source branch*, not `github.ref`. A branch that has an open
# pull request in this repository triggers both configured events, and their
# refs differ -- `refs/heads/<branch>` for the push, `refs/pull/<n>/merge` for
# the pull request -- so keying on the ref put them in separate groups and ran
# the same head twice, which is the duplication this block exists to remove.
# `head_ref` is set only on `pull_request`, so the fallback covers pushes.
#
# On `main` the key is the SHA instead, because there the run is the record
# that a merged commit builds. A shared group would not just leave it
# uncancelled: GitHub keeps one running and one pending run per group and
# discards the rest, so three merges in quick succession would leave the middle
# commit with no run at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name == 'main' && github.sha || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository (immutable action reference)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Phase 1: the legacy MySQL schema is an external contract, and
      # backend/src/test/resources/legacy/ carries a vendored copy so
      # tests can run against a real MariaDB. Only --self-test runs
      # here: the comparison needs a hr-legacy checkout this workflow
      # does not have, exactly like coverage_audit.py --check. The
      # self-test proves the drift detector itself still works, so a
      # regression in the detector fails the build; run the real
      # comparison locally against a sibling checkout before changing
      # the vendored file.
      - name: Legacy schema drift-detector self-test
        working-directory: .
        run: python3 scripts/check_legacy_schema_drift.py --self-test

      # Both detectors guard a vendored copy of something this repository does
      # not contain -- the legacy module allow-list, and the clients' endpoint
      # constants. The real comparison needs that source (an hr-legacy checkout,
      # or initialised Flutter submodules) and cannot run here; the regression
      # suites need nothing and prove the detectors still work.
      - name: Legacy module allow-list drift-detector regression suite
        working-directory: .
        run: python3 scripts/test_check_legacy_modules_drift.py

      - name: Client endpoint-list drift-detector regression suite
        working-directory: .
        run: python3 scripts/test_check_client_endpoints_drift.py

      # Two catalogs the port copies from PHP, both of which fall through
      # silently when a key is missing rather than failing -- which is how a
      # suppressed `ip` column and four untranslated error codes shipped
      # (R-071). Same shape as the detectors above: the real comparison needs
      # an hr-legacy checkout, the regression suite needs nothing.
      - name: Sensitive-response-key drift-detector regression suite
        working-directory: .
        run: python3 scripts/test_check_legacy_sensitive_keys_drift.py

      - name: Employee-import error-catalog drift-detector regression suite
        working-directory: .
        run: python3 scripts/test_check_legacy_excel_error_codes_drift.py

      # `cache: gradle` restores the dependency cache and Gradle's own
      # build cache between runs, keyed on the build files. Without it every
      # run re-resolved the whole dependency graph -- Spring Boot, Flyway,
      # Testcontainers and their transitive closure -- before compiling a
      # line. The cache is scoped per branch by the action, and a cache miss
      # simply costs what every run used to cost.
      - name: Set up Java 25 (immutable action reference; exact version, not checksum-verified)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run backend test suite
        run: ./gradlew test --console=plain --build-cache

      # Gradle prints a test count only when something fails, so a green
      # build is silent about what actually ran -- and a test class that
      # is never picked up looks exactly like one that passed. That is
      # not good enough when a specific test is the gate on starting the
      # next phase of work. This reads the JUnit XML Gradle already
      # writes and prints per-class counts, so "did it run" is answerable
      # from the log rather than by inference.
      - name: Summarise which tests ran
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          # Read the <testsuite> attributes with a regex rather than an
          # XML parser: this needs no third-party dependency on the
          # runner and avoids the stdlib parser's entity-expansion
          # surface entirely. Gradle writes this element's shape, and it
          # is the only thing being read.
          HEAD = re.compile(r'<testsuite\b[^>]*>')
          ATTR = re.compile(r'(\w+)="([^"]*)"')
          rows, totals = [], [0, 0, 0]
          for path in sorted(glob.glob('build/test-results/test/TEST-*.xml')):
              with open(path, encoding='utf-8') as handle:
                  head = HEAD.search(handle.read(4096))
              if not head:
                  print(f"?? could not read suite header: {path}")
                  continue
              attrs = dict(ATTR.findall(head.group(0)))
              tests = int(attrs.get('tests', 0))
              failures = int(attrs.get('failures', 0)) + int(attrs.get('errors', 0))
              skipped = int(attrs.get('skipped', 0))
              totals[0] += tests; totals[1] += failures; totals[2] += skipped
              rows.append((attrs.get('name', '?'), tests, failures, skipped))
          for name, tests, failures, skipped in rows:
              flag = 'FAIL' if failures else ('SKIP' if tests and skipped == tests else 'ok  ')
              print(f"{flag} {tests:4d} {name}")
          print(f"\n{len(rows)} classes, {totals[0]} tests, "
                f"{totals[1]} failed, {totals[2]} skipped")
          PY
