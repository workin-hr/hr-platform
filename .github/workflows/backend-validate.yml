name: Backend Validate

# backend/ was unlocked for real implementation on 2026-08-05
# (docs/bootstrap/decision-log.md D-028). This workflow is separate from
# Phase 0 Bootstrap Validate (phase0-validate.yml), which continues to
# gate every other component directory.

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-validate.yml"
      # The detectors this workflow runs guard files outside backend/, so a PR
      # touching only a detector, its regression suite, or the collection it
      # protects would otherwise skip the step that guards it and stay green.
      - "scripts/check_client_endpoints_drift.py"
      - "scripts/test_check_client_endpoints_drift.py"
      - "scripts/check_legacy_schema_drift.py"
      - "spike/parity-harness/client-endpoints.txt"
  push:
    branches:
      - main
      - "bootstrap/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-validate.yml"
      - "scripts/check_client_endpoints_drift.py"
      - "scripts/test_check_client_endpoints_drift.py"
      - "scripts/check_legacy_schema_drift.py"
      - "spike/parity-harness/client-endpoints.txt"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository (immutable action reference)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Fast fail before any Java setup: two schema branches cut from the
      # same base can each claim the same Flyway versions and merge
      # without textual conflict (PR #37 + #38 -> broken main, fixed in
      # PR #40). Flyway rejects duplicates at every context boot; this
      # surfaces that in seconds with the exact colliding files.
      - name: Fail on duplicate Flyway migration versions
        working-directory: .
        run: |
          python3 scripts/check_flyway_versions.py --self-test
          python3 scripts/check_flyway_versions.py

      # A bare write to a FORCE-ROW-LEVEL-SECURITY table matches zero rows
      # and still succeeds under a non-superuser migration role (V35 did
      # exactly that). The Java suite cannot catch it -- Testcontainers'
      # default Postgres user is a superuser and bypasses RLS -- so this
      # runs here, before Java, alongside the other fast migration guards.
      - name: Fail on unguarded writes to FORCE-RLS tables
        working-directory: .
        run: |
          python3 scripts/check_rls_migration_safety.py --self-test
          python3 scripts/check_rls_migration_safety.py

      # Phase 1: the legacy MySQL schema is an external contract, and
      # backend/src/test/resources/legacy/ carries a vendored copy so
      # tests can run against a real MariaDB. Only --self-test runs
      # here: the comparison needs a hr-legacy checkout this workflow
      # does not have, exactly like coverage_audit.py --check. The
      # self-test proves the drift detector itself still works, so a
      # regression in the detector fails the build; run the real
      # comparison locally against a sibling checkout before changing
      # the vendored file.
      - name: Legacy schema drift-detector self-test
        working-directory: .
        run: python3 scripts/check_legacy_schema_drift.py --self-test

      # Both detectors guard a vendored copy of something this repository does
      # not contain -- the legacy module allow-list, and the clients' endpoint
      # constants. The real comparison needs that source (an hr-legacy checkout,
      # or initialised Flutter submodules) and cannot run here; the regression
      # suites need nothing and prove the detectors still work.
      - name: Client endpoint-list drift-detector regression suite
        working-directory: .
        run: python3 scripts/test_check_client_endpoints_drift.py

      # ---------------------------------------------------------------
      # Phase 2 (storage migration) assets — FROZEN 2026-08-16.
      #
      # These guard the PostgreSQL/ETL work that Phase 1 does not use.
      # They are kept running because they are pure, database-free
      # emitted-SQL checks that finish in about a second each, so they
      # protect the frozen work without meaningfully gating a Phase 1
      # build. The expensive coupling — EtlLoadFixtureTest, ~3 minutes of
      # Testcontainers PostgreSQL inside the application suite — is what
      # the reset removed: it now lives in the `phase2Test` source set
      # and runs only on `./gradlew phase2Test`.
      # ---------------------------------------------------------------

      # PMR-10's reconciliation harness must stay proven-working: its
      # self-tests exercise every detection class on synthetic samples.
      - name: Migration-diff harness self-test
        working-directory: .
        run: python3 scripts/migration_diff.py --self-test

      # The coverage auditor proves no legacy column is dropped without a
      # recorded decision. Only --self-test runs here: --check needs the
      # legacy MySQL schema, which lives in a separate repository this
      # workflow does not check out. The self-test exercises every
      # detection class on synthetic fixtures, so a regression in the
      # detector itself still fails the build; run --check locally against
      # a legacy checkout before changing the ETL.
      - name: ETL coverage-audit self-test
        working-directory: .
        run: python3 scripts/etl/coverage_audit.py --self-test

      # The load program's own self-test asserts, on the emitted SQL, every
      # remediation decision it encodes -- which fallback each zero-date
      # guard uses, that no repair reaches for now(), that a value is never
      # cast before it is guarded. The file has always documented this
      # command (its module docstring) but nothing ran it, so the
      # assertions guarded review, not the build. Emitting SQL needs no
      # database, so it belongs here alongside the other ETL self-tests.
      - name: ETL load-program self-test
        working-directory: .
        run: python3 scripts/etl/load_postgres.py --self-test

      - name: Set up Java 25 (immutable action reference; exact version, not checksum-verified)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      # `compilePhase2TestJava` compiles the frozen Phase 2 migration
      # suite without running it. Frozen work must not be allowed to stop
      # building unnoticed, but running it here would reintroduce exactly
      # the coupling the reset removed -- ~3 minutes of Testcontainers
      # PostgreSQL inside the application build. `./gradlew phase2Test`
      # runs it on demand.
      - name: Run backend test suite (and compile the frozen Phase 2 suite)
        run: ./gradlew clean test compilePhase2TestJava --console=plain

      # Gradle prints a test count only when something fails, so a green
      # build is silent about what actually ran -- and a test class that
      # is never picked up looks exactly like one that passed. That is
      # not good enough when a specific test is the gate on starting the
      # next phase of work. This reads the JUnit XML Gradle already
      # writes and prints per-class counts, so "did it run" is answerable
      # from the log rather than by inference.
      - name: Summarise which tests ran
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          # Read the <testsuite> attributes with a regex rather than an
          # XML parser: this needs no third-party dependency on the
          # runner and avoids the stdlib parser's entity-expansion
          # surface entirely. Gradle writes this element's shape, and it
          # is the only thing being read.
          HEAD = re.compile(r'<testsuite\b[^>]*>')
          ATTR = re.compile(r'(\w+)="([^"]*)"')
          rows, totals = [], [0, 0, 0]
          for path in sorted(glob.glob('build/test-results/test/TEST-*.xml')):
              with open(path, encoding='utf-8') as handle:
                  head = HEAD.search(handle.read(4096))
              if not head:
                  print(f"?? could not read suite header: {path}")
                  continue
              attrs = dict(ATTR.findall(head.group(0)))
              tests = int(attrs.get('tests', 0))
              failures = int(attrs.get('failures', 0)) + int(attrs.get('errors', 0))
              skipped = int(attrs.get('skipped', 0))
              totals[0] += tests; totals[1] += failures; totals[2] += skipped
              rows.append((attrs.get('name', '?'), tests, failures, skipped))
          for name, tests, failures, skipped in rows:
              flag = 'FAIL' if failures else ('SKIP' if tests and skipped == tests else 'ok  ')
              print(f"{flag} {tests:4d} {name}")
          print(f"\n{len(rows)} classes, {totals[0]} tests, "
                f"{totals[1]} failed, {totals[2]} skipped")
          PY
